    // HR Dashboard Component
    function HRDashboard({ profiles, onSelectApplicant }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [filterDepartment, setFilterDepartment] = useState('all');
      const [sortBy, setSortBy] = useState('matches');

      const departments = ['all', ...Array.from(new Set(profiles.map(p => p.department)))];

      const filteredProfiles = profiles
        .filter(profile => {
          const skills = profile.skills || profile.extractedSkills.map(s => s.name);
          
          const matchesSearch = 
            profile.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            profile.role.toLowerCase().includes(searchQuery.toLowerCase()) ||
            skills.some(skill => skill.toLowerCase().includes(searchQuery.toLowerCase()));
          
          const matchesDepartment = filterDepartment === 'all' || profile.department === filterDepartment;
          
          return matchesSearch && matchesDepartment;
        })
        .sort((a, b) => {
          if (sortBy === 'name') return a.name.localeCompare(b.name);
          if (sortBy === 'matches') return b.totalMatches - a.totalMatches;
          if (sortBy === 'experience') return b.yearsExperience - a.yearsExperience;
          return 0;
        });

      return (
        <div className="max-w-7xl mx-auto">
          <div className="mb-6">
            <h2 className="text-2xl font-bold text-gray-900 mb-2">All Applicants</h2>

          {/* Navigation */}
          <nav className="bg-white border-b border-gray-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between">
                <div className="flex gap-1">
                  <button
                    onClick={() => setCurrentPage('profile')}
                    className={`flex items-center gap-2 px-6 py-4 border-b-2 ${
                      currentPage === 'profile' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-600'
                    }`}
                  >
                    <Icon name="user" className="w-5 h-5" />
                    <span className="font-medium">{viewMode === 'hr' ? 'All Applicants' : 'Profile'}</span>
                  </button>
                  <button
                    onClick={() => setCurrentPage('jobs')}
                    className={`flex items-center gap-2 px-6 py-4 border-b-2 ${
                      currentPage === 'jobs' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-600'
                    }`}
                  >
                    <Icon name="briefcase" className="w-5 h-5" />
                    <span className="font-medium">{viewMode === 'hr' ? 'Open Positions' : 'Job Matches'}</span>
                  </button>
                </div>

                <div className="flex items-center gap-2 mr-4">
                  <span className="text-sm text-gray-600">View as:</span>
                  <div className="flex bg-gray-100 rounded-lg p-1">
                    <button
                      onClick={() => setViewMode('applicant')}
                      className={`px-4 py-1.5 rounded-md text-sm font-medium ${
                        viewMode === 'applicant' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-600'
                      }`}
                    >
                      <span className="flex items-center gap-1.5">
                        <Icon name="user" className="w-4 h-4" />
                        Applicant
                      </span>
                    </button>
                    <button
                      onClick={() => setViewMode('hr')}
                      className={`px-4 py-1.5 rounded-md text-sm font-medium ${
                        viewMode === 'hr' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-600'
                      }`}
                    >
                      <span className="flex items-center gap-1.5">
                        <Icon name="users" className="w-4 h-4" />
                        HR
                      </span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </nav>

          {/* Main Content */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {viewMode === 'applicant' && currentPage === 'profile' && (
              <ProfilePage profile={selectedProfile} />
            )}
            {viewMode === 'applicant' && currentPage === 'jobs' && (
              <JobMatchPage profile={selectedProfile} />
            )}
            {viewMode === 'hr' && currentPage === 'profile' && (
              <HRDashboard profiles={profiles} onSelectApplicant={(id) => console.log('Selected:', id)} />
            )}
            {viewMode === 'hr' && currentPage === 'jobs' && (
              <HRJobPostings />
            )}
          </main>

          {/* Footer */}
          <footer className="bg-white border-t border-gray-200 mt-16">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
              <div className="bg-gradient-to-r from-emerald-50 to-teal-50 border border-emerald-200 rounded-lg p-4 mb-6">
                <div className="flex items-start gap-3">
                  <Icon name="shield" className="w-5 h-5 text-emerald-600" />
                  <div>
                    <div className="flex items-center gap-2 mb-1">
                      <span className="font-medium text-gray-900">Privacy & AI Ethics Protected</span>
                      <span className="px-2 py-0.5 bg-emerald-600 text-white text-xs rounded-full">SOC 2</span>
                      <span className="px-2 py-0.5 bg-blue-600 text-white text-xs rounded-full">GDPR</span>
                    </div>
                    <p className="text-sm text-gray-600">
                      Your career data is encrypted and protected. Our AI recommendations undergo bias detection and fairness audits.
                    </p>
                  </div>
                </div>
              </div>
              <div className="text-center text-sm text-gray-600">
                <p className="mb-2">Empowering organizations with skills-first internal mobility</p>
                <p className="text-xs text-gray-500">© 2026 InsideTrack. Transforming careers, one opportunity at a time.</p>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // Render the app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
